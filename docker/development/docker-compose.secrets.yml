# Fork-owned overlay (not upstream). Layered over docker-compose.dev.yml by bin/dev-up.
# Passes dev secrets from the direnv shell (`use sops hi-events`) into the backend.
# Laravel's env is immutable: these real env vars win over backend/.env, which holds config only.
services:
  backend:
    environment:
      APP_KEY: ${APP_KEY:?run from the repo so direnv loads `use sops hi-events`}
      JWT_SECRET: ${JWT_SECRET:?run from the repo so direnv loads `use sops hi-events`}
      DB_PASSWORD: ${DB_PASSWORD:?run from the repo so direnv loads `use sops hi-events`}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
